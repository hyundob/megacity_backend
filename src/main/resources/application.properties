spring.application.name=megacity-back
spring.datasource.url=${MEGACITY_DB_URL:jdbc:postgresql://192.168.0.3:15432/megacitydb}
spring.datasource.username=${MEGACITY_DB_USERNAME}
spring.datasource.password=${MEGACITY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
kma.key=${KMA_KEY:}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Data Sync: Source DB (TBD - 도메인 확정 후 아래 환경변수로 주입)
# 미설정 시 소스 DataSource 빈이 생성되지 않으며 싱크 잡은 graceful skip 됨.
#
# 설정 방법 (환경변수):
#   SYNC_SOURCE_DATASOURCE_URL=jdbc:postgresql://<host>:<port>/<db>?connectTimeout=5&socketTimeout=30
#   SYNC_SOURCE_DATASOURCE_USERNAME=<user>
#   SYNC_SOURCE_DATASOURCE_PASSWORD=<pass>
#
# 또는 application.properties 직접 설정:
#   sync.source.datasource.url=jdbc:postgresql://...
#   sync.source.datasource.username=...
#   sync.source.datasource.password=...
# ============================================================
sync.source.datasource.connect-timeout-ms=5000
sync.source.datasource.socket-timeout=30

# Sync tuning
sync.batch-size=1000
sync.max-batches-per-run=10
megacity.market-code=${MEGACITY_MARKET_CODE:}
megacity.cors-origins=${MEGACITY_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://210.222.202.14:13000,http://210.222.202.14:3000,http://tef.ai:13000,http://tef.ai:3000}
sync.retry.max-attempts=3
sync.retry.delays-ms=2000,4000,8000

# Lag alert: warn if last successful sync is older than this
sync.lag.alert-threshold-minutes=10

# ============================================================
# Modbus TCP slave/server
# - Excel 문서의 FC=04 Input Register 기준으로 응답
# - 문서 주소 30001은 Modbus wire address 0에 해당
# - 예: 문서 주소 90401 -> wire start address 60400
# ============================================================
modbus.enabled=true
modbus.host=${MODBUS_HOST:0.0.0.0}
modbus.port=1502
modbus.socket-timeout-ms=5000
modbus.refresh-interval-ms=60000
modbus.time-zone=Asia/Seoul
modbus.allow-function03-alias=true

# Hydrogen simulation (independent of source-table sync)
hydrogen.command-api-key=${HYDROGEN_COMMAND_API_KEY:}
hydrogen.scheduling-enabled=${HYDROGEN_SCHEDULING_ENABLED:true}
hydrogen.refill-threshold-nm3=${HYDROGEN_REFILL_THRESHOLD_NM3:2000}
hydrogen.refill-target-nm3=${HYDROGEN_REFILL_TARGET_NM3:10000}
hydrogen.tank-capacity-kg=${HYDROGEN_TANK_CAPACITY_KG:1500}
